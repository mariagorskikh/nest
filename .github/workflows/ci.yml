name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nest-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/nest-dashboard/package-lock.json
      - name: Install dashboard test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Catalog boundary tests
        run: npm test
      - name: Dashboard typecheck
        run: npm run typecheck
      - name: Dashboard lint
        run: npm run lint
      - name: Dashboard production build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke run (Lab)
        run: nandatown run marketplace --out /tmp/runs
      - name: Smoke run (Track)
        run: nandatown run quote-crash-restart --out /tmp/runs
