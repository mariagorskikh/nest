# SPDX-License-Identifier: Apache-2.0
[project]
name = "prava-payments-nanda"
version = "0.1.0"
description = "Prava agentic-payments plugin for the Nanda Town payments layer."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["nest-core", "nest-sdk"]

# Registers this plugin under the payments layer as `prava`, so a scenario YAML
# can select it with `layers: { payments: prava }`.
[project.entry-points."nest.plugins.payments"]
prava = "prava_payments.plugin:PravaPayments"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prava_payments"]
