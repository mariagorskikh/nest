# SPDX-License-Identifier: Apache-2.0
name: prava_payment
description: >-
  One NANDA buyer quotes and pays one seller through the Prava Session API.
  The companion examples/one_payment.py runner performs the interactive card
  and passkey handoff and records both success and failure outcomes.
tier: 1
seed: 42
agents:
  count: 2
  brain: state-machine
  roles:
    - name: buyer
      count: 1
    - name: seller
      count: 1
layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prava
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1
task:
  type: prava_payment
  config:
    service: restock-trigger-evaluation
    amount_minor: 100
    currency: USD
    interactive_runner: examples/one_payment.py
failures:
  message_drop: 0.0
  byzantine_agents: 0.0
duration: "ticks: 100"
metrics:
  - delivery_rate
  - message_count
output:
  trace: ./traces/prava_payment.jsonl

