# SPDX-License-Identifier: Apache-2.0
# Canonical Problem 04 entry point.
#
# This uses EFS Scribe as the concrete workload: delegated leaf agents submit
# path-scoped write intents and receive deterministic offline receipts.
name: delegated_auth
description: >-
  Problem 04 delegated auth exercised through offline EFS Scribe write
  intents, deterministic receipts, and adversarial rejection checks.

tier: 1
seed: 42

agents:
  count: 18
  brain: state-machine
  roles:
    - name: coordinator
      count: 1
    - name: intermediary
      count: 3
    - name: leaf
      count: 12
    - name: scribe
      count: 1
    - name: verifier
      count: 1

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: delegatable
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: cid_facts

task:
  type: efs_scribe_offline
  config: {}

failures:
  message_drop: 0.0

duration: "ticks: 1000"

metrics:
  - message_count

output:
  trace: ./traces/delegated_auth.jsonl
