# SPDX-License-Identifier: Apache-2.0
# Scenario to run delegated auth verification checks: honest delegation,
# scope escalation, stale parent, and audience confusion.
name: delegated_auth
description: "1 coordinator, 3 intermediaries, and 12 leaf agents verifying delegated capability tokens."

tier: 1
seed: 42

agents:
  count: 16
  brain: state-machine
  roles:
    - name: coordinator
      count: 1
    - name: intermediary
      count: 3
    - name: leaf
      count: 12

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: delegatable
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: delegated_auth
  config:
    delegation_depth: 2

failures:
  message_drop: 0.0

duration: "ticks: 1000"

metrics:
  - message_count

output:
  trace: ./traces/delegated_auth.jsonl
