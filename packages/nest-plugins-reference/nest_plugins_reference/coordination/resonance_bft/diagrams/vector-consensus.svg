<marker id="ma" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#b8730f"/></marker>
<linearGradient id="gA" gradientUnits="userSpaceOnUse" x1="150" y1="58" x2="345" y2="270"><stop offset="0" stop-color="#2f6feb" stop-opacity="0"/><stop offset="0.55" stop-color="#2f6feb" stop-opacity="0.5"/><stop offset="1" stop-color="#2f6feb" stop-opacity="1"/></linearGradient>
