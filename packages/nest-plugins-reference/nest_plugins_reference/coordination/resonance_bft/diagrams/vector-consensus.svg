<svg width="680" viewBox="0 0 680 412" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Consensus in embedding space: four coloured agents follow long gradient trajectories with offset velocity arrows into a shared consensus domain drawn as concentric elliptical projection rings whose bullseye is the consensus, while a tampered trajectory is excluded</title>
<desc>A perspective 3-D embedding space. Four coloured comet-trail trajectories with velocity arrows converge into a shared consensus domain marked by concentric horizontal elliptical projection rings floating in space, whose bullseye centre is the consensus; a Byzantine trajectory diverges and is excluded.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#57606a}.th{font-size:14px;font-weight:500;fill:#1f2328}
.grid{stroke:#d0d7de;stroke-width:1;fill:none}.floor{fill:#f6f8fa;stroke:#d0d7de}
.dom{fill:none;stroke:#8b949e;stroke-width:1.2;stroke-dasharray:4 3}.stem{stroke:#b8c1cc;stroke-width:1;stroke-dasharray:2 3}
.tgt{fill:none;stroke:#57606a;stroke-width:1.5}.cx{stroke:#d1242f;stroke-width:2.5}.lead{stroke:#8b949e;stroke-width:1;fill:none}
@media (prefers-color-scheme:dark){.th{fill:#e6edf3}.ts{fill:#9aa5b1}.grid{stroke:#30363d}.floor{fill:#161b22;stroke:#30363d}.stem{stroke:#3a434d}.tgt{stroke:#9aa5b1}.dom{stroke:#6e7681}}
</style>
