<svg width="680" viewBox="0 0 680 336" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ResonanceBFT architecture flow: agents and LLM perceive five axes, sealed into the deterministic n-f commit core, with audit and adapt feeding back only trust</title>
<desc>Agents and an LLM at the edge produce a five-axis belief vector, sealed and passed to the deterministic n-f commit core which emits a committed outcome. L2 audit and L3 adapt sit below and feed back only trust for the next round; they never alter the commit.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#1f2328}.ts{font-size:12px;fill:#57606a}
.box{fill:#f6f8fa;stroke:#d0d7de}.core{fill:#e6f1fb;stroke:#378add}.amber{fill:#faeeda;stroke:#ba7517}
.ax{fill:#8ab4d8}.dot{fill:#8b949e}.ln{stroke:#8b949e;stroke-width:1.6;fill:none}.lock{stroke:#57606a;stroke-width:1.6;fill:none}
.ab{fill:#185fa5}
@media (prefers-color-scheme:dark){.t{fill:#e6edf3}.ts{fill:#9aa5b1}.ab{fill:#85b7eb}
.box{fill:#161b22;stroke:#30363d}.core{fill:#0d2237;stroke:#378add}.amber{fill:#3a2a0a;stroke:#ba7517}.lock{stroke:#9aa5b1}}
</style>
<rect class="box" x="40" y="98" width="100" height="78" rx="12"/>
<circle class="dot" cx="66" cy="124" r="7"/><circle class="dot" cx="90" cy="124" r="7"/><circle class="dot" cx="114" cy="124" r="7"/>
<text class="ts" x="90" y="154" text-anchor="middle">agents · LLM</text><text class="ts" x="90" y="169" text-anchor="middle">(the edge)</text>
<path class="ln" d="M142 137 h34" marker-end="url(#a)"/><text class="ts" x="159" y="129" text-anchor="middle">perceive</text>
<rect class="box" x="180" y="102" width="72" height="70" rx="10"/>
<rect class="ax" x="190" y="140" width="8" height="18" rx="2"/><rect class="ax" x="202" y="126" width="8" height="32" rx="2"/>
<rect class="ax" x="214" y="132" width="8" height="26" rx="2"/><rect class="ax" x="226" y="120" width="8" height="38" rx="2"/>
<rect class="ax" x="238" y="136" width="8" height="22" rx="2"/>
<text class="ts" x="216" y="188" text-anchor="middle">5-axis vector</text>
<path class="ln" d="M256 137 h12" marker-end="url(#a)"/>
<rect x="278" y="128" width="20" height="17" rx="3" class="lock"/><path class="lock" d="M282 128 v-5 a6 6 0 0 1 12 0 v5" fill="none"/><circle cx="288" cy="137" r="2" fill="#57606a"/>
<text class="ts" x="288" y="169" text-anchor="middle">seal</text>
<path class="ln" d="M300 137 h18" marker-end="url(#a)"/>
<rect class="core" x="324" y="100" width="196" height="74" rx="14"/>
<text class="t" x="422" y="131" text-anchor="middle" font-weight="500">L1 · n − f commit</text>
<text class="ab" x="422" y="151" text-anchor="middle">the only safety certificate</text>
<path class="ln" d="M520 137 h30" marker-end="url(#a)"/>
<rect class="box" x="554" y="110" width="86" height="56" rx="12"/>
<text class="t" x="597" y="135" text-anchor="middle">committed</text><text class="ts" x="597" y="151" text-anchor="middle">outcome</text>
<path class="ln" d="M422 174 v34" marker-end="url(#a)"/><text class="ts" x="436" y="196" text-anchor="start">emit for audit</text>
<rect class="amber" x="300" y="210" width="118" height="56" rx="12"/>
<text class="t" x="359" y="234" text-anchor="middle">L2 · audit</text><text class="ts" x="359" y="252" text-anchor="middle">genuine? tampered?</text>
<rect class="box" x="430" y="210" width="118" height="56" rx="12"/>
<text class="t" x="489" y="234" text-anchor="middle">L3 · adapt</text><text class="ts" x="489" y="252" text-anchor="middle">trust · weights</text>
<path class="ln" d="M548 238 h22 a10 10 0 0 0 10 -10 V162 a10 10 0 0 0 -10 -10 H522" marker-end="url(#a)"/>
<text class="ts" x="600" y="200" text-anchor="middle">trust for</text><text class="ts" x="600" y="215" text-anchor="middle">next round</text>
<text class="ts" x="40" y="302">L2 / L3 feed back only trust for the next round — the L1 commit certificate is never altered.</text>
<text class="ts" x="40" y="320">The LLM's nondeterminism is frozen at the seal, so the commit is a pure function of the vectors.</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
</svg>
