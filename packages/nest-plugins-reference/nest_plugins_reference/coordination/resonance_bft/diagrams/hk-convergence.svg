<svg width="680" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Hegselmann-Krause deliberation monotonically contracts the honest opinion diameter over steps, from 1.61 to 1.34, the convergence guarantee</title>
<desc>Line chart: the honest opinion diameter decreases monotonically across four deliberation steps from 1.61 to 1.34, showing bounded-confidence averaging converges.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#57606a}.th{font-size:14px;font-weight:500;fill:#1f2328}
.axis{stroke:#8b949e;stroke-width:1.5}.line{fill:none;stroke:#2f6feb;stroke-width:2.5}.area{fill:#2f6feb;fill-opacity:0.1}.pt{fill:#2f6feb}.bt{fill:#185fa5}
@media (prefers-color-scheme:dark){.th{fill:#e6edf3}.ts{fill:#9aa5b1}.axis{stroke:#6e7681}.bt{fill:#85b7eb}}
</style>
<text class="th" x="40" y="26">Deliberation contracts the opinion diameter — the convergence engine</text>
<line class="axis" x1="130" y1="60" x2="130" y2="248"/><line class="axis" x1="130" y1="248" x2="560" y2="248"/>
<text class="ts" x="122" y="102" text-anchor="end">1.6</text><text class="ts" x="122" y="175" text-anchor="end">0.8</text><text class="ts" x="122" y="252" text-anchor="end">0</text>
<text class="ts" x="345" y="272" text-anchor="middle">deliberation step</text>
<polygon class="area" points="160,98 260,106 360,114 460,120 540,123 540,248 160,248"/>
<polyline class="line" points="160,98 260,106 360,114 460,120 540,123"/>
<circle class="pt" cx="160" cy="98" r="5"/><circle class="pt" cx="260" cy="106" r="5"/><circle class="pt" cx="360" cy="114" r="5"/><circle class="pt" cx="460" cy="120" r="5"/><circle class="pt" cx="540" cy="123" r="5"/>
<text class="bt" x="160" y="88" text-anchor="middle">1.61</text><text class="bt" x="540" y="113" text-anchor="middle">1.34</text>
<text class="ts" x="160" y="264" text-anchor="middle">0</text><text class="ts" x="260" y="264" text-anchor="middle">1</text><text class="ts" x="360" y="264" text-anchor="middle">2</text><text class="ts" x="460" y="264" text-anchor="middle">3</text><text class="ts" x="540" y="264" text-anchor="middle">4</text>
<text class="ts" x="40" y="292">Bounded-confidence (Hegselmann–Krause) averaging monotonically shrinks the honest opinion diameter each step — test_deliberation_contracts_opinion_diameter.</text>
</svg>
