<svg width="680" viewBox="0 0 680 356" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Multi-dimensional vectorization: one opinion becomes a point on five independent pentadic belief axes shown as a radar</title>
<desc>An opinion is sealed and vectorised into five independent axes — semantic, affective, relational, epistemic, behavioral — each with its own value, forming an irregular radar polygon.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#1f2328}.ts{font-size:12px;fill:#57606a}.th{font-size:14px;font-weight:500;fill:#1f2328}
.bub{fill:#f6f8fa;stroke:#d0d7de}.ring{fill:none;stroke:#d0d7de}.spoke{stroke:#c9d1d9;stroke-width:1}
.poly{fill:#2f6feb;fill-opacity:0.16;stroke:#2f6feb;stroke-width:2}.pt{fill:#2f6feb}.ln{stroke:#8b949e;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.t,.th{fill:#e6edf3}.ts{fill:#9aa5b1}.bub{fill:#161b22;stroke:#30363d}.ring{stroke:#30363d}.spoke{stroke:#30363d}}
</style>
<text class="th" x="40" y="28">Multi-dimensional vectorization — one opinion, five independent axes</text>
<rect class="bub" x="40" y="150" width="176" height="72" rx="12"/>
<text class="ts" x="128" y="182" text-anchor="middle">“approve — the CI</text><text class="ts" x="128" y="200" text-anchor="middle">gates look solid”</text>
<path class="ln" d="M220 186 h70" marker-end="url(#a)"/><text class="ts" x="255" y="178" text-anchor="middle">seal · vectorise</text>
<polygon class="ring" points="485,90 571,152 538,253 432,253 399,152"/>
<polygon class="ring" points="485,120 542,161 520,228 450,228 428,161"/>
<polygon class="ring" points="485,150 513,171 503,204 467,204 457,171"/>
<line class="spoke" x1="485" y1="180" x2="485" y2="90"/><line class="spoke" x1="485" y1="180" x2="571" y2="152"/>
<line class="spoke" x1="485" y1="180" x2="538" y2="253"/><line class="spoke" x1="485" y1="180" x2="432" y2="253"/><line class="spoke" x1="485" y1="180" x2="399" y2="152"/>
<polygon class="poly" points="485,99 528,166 527,238 456,220 425,160"/>
<circle class="pt" cx="485" cy="99" r="4"/><circle class="pt" cx="528" cy="166" r="4"/><circle class="pt" cx="527" cy="238" r="4"/><circle class="pt" cx="456" cy="220" r="4"/><circle class="pt" cx="425" cy="160" r="4"/>
<text class="ts" x="485" y="80" text-anchor="middle">semantic</text>
<text class="ts" x="582" y="150" text-anchor="start">affective</text>
<text class="ts" x="548" y="270" text-anchor="middle">relational</text>
<text class="ts" x="420" y="270" text-anchor="middle">epistemic</text>
<text class="ts" x="388" y="150" text-anchor="end">behavioral</text>
<text class="ts" x="40" y="316">The opinion lands at a DIFFERENT value on each axis — an irregular shape, not a regular pentagon.</text>
<text class="ts" x="40" y="334">That per-axis spread is the multi-dimensionality: five signals a single scalar vote would collapse.</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
</svg>
