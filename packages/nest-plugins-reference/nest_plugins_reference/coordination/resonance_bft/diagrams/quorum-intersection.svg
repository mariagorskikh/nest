<svg width="680" viewBox="0 0 680 296" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Quorum intersection safety: two n-minus-f quorums over seven nodes overlap in f+1 nodes, guaranteeing at least one shared honest node</title>
<desc>Seven nodes, f=2 Byzantine. Quorum A covers five nodes, quorum B covers five nodes; their overlap is three nodes (f+1), which must contain at least one honest node, so two quorums can never commit conflicting values.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#57606a}.th{font-size:14px;font-weight:500;fill:#1f2328}
.node{fill:#eef2f6;stroke:#8b949e}.byz{fill:#faeeda;stroke:#ba7517}.qa{fill:none;stroke:#378add;stroke-width:1.6}.qb{fill:none;stroke:#1d9e75;stroke-width:1.6}
.ov{fill:#639922;fill-opacity:0.12;stroke:#639922;stroke-dasharray:4 3}.ab{fill:#185fa5}.at{fill:#0f6e56}.og{fill:#3b6d11}
@media (prefers-color-scheme:dark){.th{fill:#e6edf3}.ts{fill:#9aa5b1}.node{fill:#161b22;stroke:#6e7681}.byz{fill:#3a2a0a;stroke:#ba7517}.ab{fill:#85b7eb}.at{fill:#5dcaa5}.og{fill:#97c459}}
</style>
<text class="th" x="40" y="28">Quorum intersection — why the commit uses n − f (n=7, f=2)</text>
<rect class="ov" x="266" y="96" width="148" height="88" rx="10"/>
<g><circle class="node" cx="120" cy="150" r="18"/><text class="ts" x="120" y="154" text-anchor="middle">a0</text></g>
<g><circle class="node" cx="192" cy="150" r="18"/><text class="ts" x="192" y="154" text-anchor="middle">a1</text></g>
<g><circle class="byz" cx="264" cy="150" r="18"/><text class="ts" x="264" y="154" text-anchor="middle">a2</text></g>
<g><circle class="node" cx="340" cy="150" r="18"/><text class="ts" x="340" y="154" text-anchor="middle">a3</text></g>
<g><circle class="byz" cx="416" cy="150" r="18"/><text class="ts" x="416" y="154" text-anchor="middle">a4</text></g>
<g><circle class="node" cx="492" cy="150" r="18"/><text class="ts" x="492" y="154" text-anchor="middle">a5</text></g>
<g><circle class="node" cx="564" cy="150" r="18"/><text class="ts" x="564" y="154" text-anchor="middle">a6</text></g>
<rect class="qa" x="96" y="104" width="268" height="40" rx="20"/><text class="ab" x="102" y="98" font-size="12">quorum A · 5 = n−f</text>
<rect class="qb" x="240" y="156" width="348" height="40" rx="20"/><text class="at" x="470" y="210" font-size="12">quorum B · 5 = n−f</text>
<text class="og" x="340" y="90" text-anchor="middle" font-size="12">overlap = 3 = f+1</text>
<text class="ts" x="40" y="248">Any two 5-node quorums share ≥ f+1 = 3 nodes. With only f=2 Byzantine (amber), that overlap</text>
<text class="ts" x="40" y="266">always contains ≥ 1 honest node — so two quorums can never commit conflicting values (no split-brain).</text>
</svg>
