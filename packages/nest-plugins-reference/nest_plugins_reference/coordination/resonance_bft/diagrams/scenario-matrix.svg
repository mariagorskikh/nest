<rect class="ok" x="212" y="150" width="88" height="32" rx="6"/><text class="gt" x="256" y="170" text-anchor="middle">✓ t=2</text><rect class="ok" x="306" y="150" width="88" height="32" rx="6"/><text class="gt" x="350" y="170" text-anchor="middle">✓ t=2</text><rect class="ok" x="400" y="150" width="88" height="32" rx="6"/><text class="gt" x="444" y="170" text-anchor="middle">✓ t=2</text><rect class="ok" x="494" y="150" width="88" height="32" rx="6"/><text class="gt" x="538" y="170" text-anchor="middle">✓ t=2</text>
