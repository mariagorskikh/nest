<text class="ts" x="196" y="131" text-anchor="end">silent-crash</text>
<rect class="ok" x="212" y="112" width="88" height="32" rx="6"/><text class="gt" x="256" y="132" text-anchor="middle">✓</text><rect class="ok" x="306" y="112" width="88" height="32" rx="6"/><text class="gt" x="350" y="132" text-anchor="middle">✓</text><rect class="ok" x="400" y="112" width="88" height="32" rx="6"/><text class="gt" x="444" y="132" text-anchor="middle">✓</text><rect class="ok" x="494" y="112" width="88" height="32" rx="6"/><text class="gt" x="538" y="132" text-anchor="middle">✓</text>
