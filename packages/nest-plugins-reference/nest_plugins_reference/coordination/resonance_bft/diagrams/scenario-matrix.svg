<svg width="680" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Scenario outcome matrix: five town scenarios across four models all reach their designed outcome — commits where expected, byzantine tampered equals 2, partition never commits</title>
<desc>A grid of five scenarios by four models. Genuine, silent-crash, byzantine and bag-of-words all commit on every model; byzantine shows tampered=2; partition never commits. The outcome is the same across models — model-agnostic.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#57606a}.th{font-size:14px;font-weight:500;fill:#1f2328}.t{font-size:14px;fill:#1f2328}
.ok{fill:#eaf3de;stroke:#639922}.no{fill:#f6f8fa;stroke:#d0d7de}.gt{fill:#3b6d11}
@media (prefers-color-scheme:dark){.th,.t{fill:#e6edf3}.ts{fill:#9aa5b1}.ok{fill:#1f2e10;stroke:#639922}.no{fill:#161b22;stroke:#30363d}.gt{fill:#97c459}}
</style>
<text class="th" x="40" y="26">Scenario × model — same outcome on every model (model-agnostic)</text>
<text class="ts" x="256" y="64" text-anchor="middle">mock</text><text class="ts" x="350" y="64" text-anchor="middle">claude</text><text class="ts" x="444" y="64" text-anchor="middle">codex</text><text class="ts" x="538" y="64" text-anchor="middle">agy</text>
<text class="ts" x="196" y="93" text-anchor="end">genuine (12)</text>
