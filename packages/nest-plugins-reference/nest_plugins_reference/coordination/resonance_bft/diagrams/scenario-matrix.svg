<rect class="ok" x="212" y="226" width="88" height="32" rx="6"/><text class="gt" x="256" y="246" text-anchor="middle">✓</text><rect class="ok" x="306" y="226" width="88" height="32" rx="6"/><text class="gt" x="350" y="246" text-anchor="middle">✓</text><rect class="ok" x="400" y="226" width="88" height="32" rx="6"/><text class="gt" x="444" y="246" text-anchor="middle">✓</text><rect class="ok" x="494" y="226" width="88" height="32" rx="6"/><text class="gt" x="538" y="246" text-anchor="middle">✓</text>
<text class="ts" x="40" y="288">Every quorum-slack case commits identically across models; byzantine detects+excludes (tampered=2); partition safely never commits.</text>
<text class="ts" x="40" y="306">At the zero-slack quorum floor (silent-crash), commit rate is agy 10/10 · claude 9/10 · codex 9/10 — the ~1-in-10 no-commit is safe.</text>
