<svg width="680" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Scale results: the real town commits at n equals 4, 7, 13, 25, 49 with the quorum tracking n minus f exactly, confirmed on three models</title>
<desc>Bar chart of commit quorum versus cluster size. At n = 4, 7, 13, 25, 49 the commit quorum is 3, 5, 9, 17, 33 — exactly n minus f — and every run committed, on mock plus Gemini at all sizes and claude-haiku plus gpt-5.5 at n=13 and 25.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#57606a}.th{font-size:14px;font-weight:500;fill:#1f2328}.t{font-size:14px;fill:#1f2328}
.axis{stroke:#8b949e;stroke-width:1.5}.bar{fill:#639922}.gt{fill:#3b6d11}
@media (prefers-color-scheme:dark){.th,.t{fill:#e6edf3}.ts{fill:#9aa5b1}.axis{stroke:#6e7681}.gt{fill:#97c459}}
</style>
<text class="th" x="40" y="26">Scale — the real town commits at every size, quorum = n − f</text>
<line class="axis" x1="90" y1="60" x2="90" y2="250"/><line class="axis" x1="90" y1="250" x2="560" y2="250"/>
<text class="ts" x="82" y="84" text-anchor="end">quorum</text>
<rect class="bar" x="120" y="234" width="64" height="16" rx="3"/><text class="gt" x="152" y="228" text-anchor="middle">3/3</text><text class="ts" x="152" y="266" text-anchor="middle">n=4</text>
<rect class="bar" x="208" y="224" width="64" height="26" rx="3"/><text class="gt" x="240" y="218" text-anchor="middle">5/5</text><text class="ts" x="240" y="266" text-anchor="middle">n=7</text>
<rect class="bar" x="296" y="204" width="64" height="46" rx="3"/><text class="gt" x="328" y="198" text-anchor="middle">9/9</text><text class="ts" x="328" y="266" text-anchor="middle">n=13</text>
<rect class="bar" x="384" y="162" width="64" height="88" rx="3"/><text class="gt" x="416" y="156" text-anchor="middle">17/17</text><text class="ts" x="416" y="266" text-anchor="middle">n=25</text>
<rect class="bar" x="472" y="80" width="64" height="170" rx="3"/><text class="gt" x="504" y="74" text-anchor="middle">33/33</text><text class="ts" x="504" y="266" text-anchor="middle">n=49</text>
<text class="ts" x="40" y="290">Every run committed with quorum = n − f exactly — mock + Gemini 3.5 Flash at all sizes; claude-haiku-4-5 + gpt-5.5 at n=13, 25.</text>
</svg>
