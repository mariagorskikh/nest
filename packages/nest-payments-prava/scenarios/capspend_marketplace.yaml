# SPDX-License-Identifier: Apache-2.0
# CapSpend Marketplace — Prava Adapter scenario
#
# A procurement buyer autonomously negotiates with three sellers
# (software, cloud, hardware) using the Prava Agentic Payments adapter
# as the exclusive payment layer.
#
# Two representative payment outcomes are scripted:
#   - Successful charge  -- software_seller, $99  (under $150 token limit)
#   - Successful charge  -- cloud_seller,    $120 (under $150 token limit)
#   - Expected decline   -- hardware_seller, $200 (exceeds token limit)
#
# Run with:
#   python -m nest_core.cli run scenarios/capspend_marketplace.yaml

name: capspend_marketplace
description: |
  Multi-agent B2B marketplace where an autonomous procurement buyer
  discovers and transacts with software, cloud, and hardware sellers
  using Prava Visa Network Tokens as the payment instrument.

  Demonstrates:
    - Successful Prava sandbox charge (amount <= $150 token limit)
    - Expected PaymentDeclined failure (amount > $150)
    - Autonomous buyer operating solo without team collaboration logic

tier: 1
seed: 42

agents:
  count: 4
  brain: state-machine
  roles:
    - name: procurement_buyer
      count: 1
      config:
        solo: true
        initial_balance: 1000
        prava_token:
          pan: "4111111111111111"
          cvv: "123"
          expiry: "12/27"
          limit: 150

    - name: software_seller
      count: 1
      config:
        initial_balance: 0
        catalog:
          - id: "sw-enterprise-license"
            name: "Enterprise Software License"
            price: 99          # under token limit -- will succeed
            currency: "USD"

    - name: cloud_seller
      count: 1
      config:
        initial_balance: 0
        catalog:
          - id: "cloud-compute-1mo"
            name: "Cloud Compute -- 1 Month"
            price: 120         # under token limit -- will succeed
            currency: "USD"

    - name: hardware_seller
      count: 1
      config:
        initial_balance: 0
        catalog:
          - id: "hw-server-rack"
            name: "Server Rack Unit"
            price: 200         # exceeds token limit -- EXPECTED DECLINE

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prava_adapter
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: marketplace
  config:
    catalog_size: 3
    rounds: 3
    scripted_transactions:
      - ref: "capspend-success-01"
        buyer: procurement_buyer
        seller: software_seller
        item_id: "sw-enterprise-license"
        amount: 99
        currency: "USD"
        expected_outcome: confirmed

      - ref: "capspend-decline-01"
        buyer: procurement_buyer
        seller: hardware_seller
        item_id: "hw-server-rack"
        amount: 200
        currency: "USD"
        expected_outcome: declined
        decline_reason: "amount_exceeds_token_limit"

      - ref: "capspend-success-02"
        buyer: procurement_buyer
        seller: cloud_seller
        item_id: "cloud-compute-1mo"
        amount: 120
        currency: "USD"
        expected_outcome: confirmed

failures:
  message_drop: 0.0
  byzantine_agents: 0.0

duration: "ticks: 5000"

metrics:
  - success_rate
  - message_count

output:
  trace: ./traces/capspend_marketplace.jsonl
