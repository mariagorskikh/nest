# SPDX-License-Identifier: Apache-2.0
[project]
name = "nest-payments-prava"
version = "0.1.0"
description = "Prava Agentic Payments adapter for NANDA Town — enables agents to quote, pay, verify, and refund via the Prava Visa Network Token sandbox"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "nest-core",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/projnanda/nandatown"
Repository = "https://github.com/projnanda/nandatown"

# Entry-point registration for the nest-core PluginRegistry.
# After installation, `layers.payments: prava_adapter` in any scenario YAML
# resolves to this class automatically — no code changes required.
[project.entry-points."nest.plugins.payments"]
prava_adapter = "nest_payments_prava.prava_plugin:PravaPaymentLayer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nest_payments_prava"]
