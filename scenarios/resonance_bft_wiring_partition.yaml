# SPDX-License-Identifier: Apache-2.0
# SCOPE (honest): task.type is `consensus`, the framework's BUILT-IN leader/follower vote —
# this scenario exercises the LAYER WIRING and agent lifecycle with ResonanceBFT resolved as
# the coordination plugin, but it does NOT drive the ResonanceBFT protocol rounds. For a run
# where the plugin actually drives propose→participate→resolve→commit over the transport, use
# `resonance_bft_consensus.yaml` / `resonance_bft_consensus_partition.yaml` (task.type:
# resonance_bft_consensus). The partition PROPERTY is verified by the unit suite
# (TestPartitionQuorumSafety / TestConfiguredMembershipFloor); the comment below describes the
# protocol behaviour that suite proves, not what this generic-wiring run emits.
#
# ResonanceBFT under network partition: with a 4/3 split and quorum_needed=5, NEITHER side
# can commit alone — both are stuck until the partition heals; then the full group commits.
# 7 agents (n=7, f=2, quorum_needed=n-f=5).
# Partition splits 4/3 per the problem spec.  The majority (4 agents) is
# BELOW quorum_needed=5 alone, so NEITHER group commits during the partition —
# demonstrating that liveness requires a sufficient quorum.  After healing,
# all 7 participate and the protocol commits.
#
# This matches the spec requirement: "partition splitting them 4/3 for the
# first 30% of the scenario, plus a heal."
#
# Determinism: the protocol produces a valid outcome (committed or aborted)
# under seeds 42, 7, 1337, and 0xdeadbeef — verified by
# test_multi_seed_determinism in tests/test_resonance_bft.py.

name: resonance_bft_wiring_partition
description: |
  ResonanceBFT consensus with a 4/3 network partition (spec-required split).
  With quorum_needed=5 (n-f = 7-2), neither partition can commit alone.
  After healing, the full 7-agent group commits.  This demonstrates the
  liveness property: progress requires sufficient quorum, not just majority.

tier: 1
seed: 42

agents:
  count: 7
  brain: state-machine
  roles:
    - name: leader
      count: 1
    - name: follower
      count: 6

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: resonance_bft
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: consensus
  config:
    rounds: 5
    quorum: 0.667
    # Fixed cluster membership (n=7). ResonanceBFT.resolve() reads expected_n from
    # (in priority) propose(all_agents=...), task.metadata["expected_participants"],
    # or the ResonanceBFT(expected_n=...) constructor arg, and uses it so a partitioned
    # minority computes quorum_needed = n-f against n=7, not against the messages it got.
    # NOTE: this requires the scenario runner to surface this value to one of those
    # inputs. The split-brain-safety PROPERTY itself is verified independently of the
    # runner by TestPartitionQuorumSafety (a 4-of-7 partition aborts; the heal commits).
    expected_participants: 7

failures:
  message_drop: 0.0
  network_partition:
    groups:
      - [leader-0, follower-0, follower-1, follower-2]
      - [follower-3, follower-4, follower-5]
  byzantine_agents: 0.0

duration: "ticks: 10000"

metrics:
  - success_rate
  - message_count
  - agent_count

output:
  trace: ./traces/bft_consensus_partition.jsonl
