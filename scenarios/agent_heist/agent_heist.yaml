# SPDX-License-Identifier: Apache-2.0
# Agent Heist: Scarcity-driven adversarial marketplace scenario.
#
# Scenario: 7 merchants compete to serve 8 buyers
# Each merchant has exactly 1 complete Caesar Salad recipe (14 ingredients)
# At least 1 buyer is guaranteed to fail due to scarcity!
#
# Agents:
#   - 8 Buyers: 4 naive (accept any price), 4 defended (reject inflated prices)
#   - 7 Merchants: 4 honest (fair quotes), 3 adversarial (price inflation)
#
# Key Dynamics:
#   - Race condition: Early buyers get honest merchants, late buyers face adversarial
#   - Defended buyers may reject inflated prices and then find honest merchants sold out
#   - Naive buyers may overpay but at least complete their recipes
#   - True scarcity: Not just "can't afford" but "literally unavailable"
#
# Adversarial Tactics:
#   - Price inflation: 3x the catalog price (70% attack rate)
#   - Prava mandate cap ($100) still protects against extreme overcharges

name: agent_heist
description: |
  Scarcity-driven adversarial marketplace scenario.
  7 merchants with 1 recipe each compete to serve 8 buyers.
  At least 1 buyer guaranteed to fail due to scarcity.

tier: 1
seed: 42

agents:
  count: 15  # 8 buyers + 7 merchants
  brain: state-machine
  roles:
    # Naive buyers - accept any price
    - name: naive_buyer
      count: 4
      config:
        max_purchases: 20
        sanitize_listings: false
        validate_quotes: false
        price_tolerance: 999.99

    # Defended buyers - reject inflated prices
    - name: defended_buyer
      count: 4
      config:
        max_purchases: 20
        sanitize_listings: true
        validate_quotes: true
        price_tolerance: 1.1  # Reject quotes > 110% of catalog price

    # Honest merchants - quote actual catalog prices
    - name: honest_merchant
      count: 4
      config:
        merchant_type: honest

    # Adversarial merchants - use price inflation
    - name: adversarial_merchant
      count: 3
      config:
        merchant_type: adversarial
        tactics:
          - price_inflation

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prava
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: agent_heist
  config:
    # Catalog file with products and merchant assignments
    catalog_file: scenarios/agent_heist/catalog.yaml
    # Mandates file generated by provision.py
    mandates_file: scenarios/agent_heist/mandates.json
    # Maximum purchases per buyer (14 ingredients needed for full recipe)
    max_purchases_per_buyer: 20
    # Mandate cap in cents (for validation)
    mandate_cap_cents: 10000  # $100.00
    # Number of buyers
    naive_buyers: 4
    defended_buyers: 4
    # Number of merchants
    honest_merchants: 4
    adversarial_merchants: 3
    # Stock per item per merchant (1 = scarcity scenario)
    stock_per_item: 1
    # Price inflation multiplier for adversarial merchants
    price_multiplier: 3.0
    # Probability that adversarial merchants use attacks vs honest pricing
    # 0.0 = always honest, 1.0 = always attack, 0.7 = 70% attack rate
    attack_probability: 0.7
    # Hybrid mode: mix of deterministic (Tier 1) and LLM (Tier 2) agents
    # When enabled, first half of each agent type is deterministic, second half is LLM
    # Set to false to run fully deterministic (default)
    enable_llm_agents: true
    # LLM configuration (only used when enable_llm_agents is true)
    llm_config:
      provider: openai  # "anthropic" or "openai"
      model: gpt-4o-mini  # Model name
      temperature: 0.7
      max_tokens: 512

failures:
  message_drop: 0.0
  byzantine_agents: 0.0

duration: "ticks: 50000"

metrics:
  - message_count
  - agent_count
  - delivery_rate
  - payment_total
  - threshold_exceeded_count
  - naive_losses
  - attacks_blocked
  - successful_purchases

output:
  trace: ./traces/agent_heist.jsonl
  report: ./reports/agent_heist.html
