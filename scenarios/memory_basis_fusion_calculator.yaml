# SPDX-License-Identifier: Apache-2.0
# Calculator fusion scenario: only reports with a valid basis/overlap against
# the calculator node are allowed to fuse; copypasta-like context saturation is
# ignored because it has no legal restriction map into the node.
name: memory_basis_fusion_calculator
description: "Basis-restricted calculator memory fusion survives copypasta context saturation."

tier: 1
seed: 42

agents:
  count: 7
  brain: state-machine
  roles:
    - name: coordinator
      count: 1
    - name: reporter
      count: 6

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: pn_counter
  privacy: noop
  datafacts: datafacts_v1

task:
  type: memory_basis_fusion_calculator
  config:
    required_basis: [add, subtract, multiply, divide]
    threshold: 4

failures:
  message_drop: 0.0

duration: "ticks: 1000"

metrics:
  - message_count
  - agent_count

output:
  trace: ./traces/memory_basis_fusion_calculator.jsonl
