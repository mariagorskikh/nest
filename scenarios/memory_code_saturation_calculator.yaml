# SPDX-License-Identifier: Apache-2.0
# Calculator fusion scenario with a code-shaped saturation payload sourced from
# a permissively licensed AMDGPU driver file in torvalds/linux.
name: memory_code_saturation_calculator
description: "Basis-restricted calculator memory fusion ignores code-shaped context saturation."

tier: 1
seed: 42

agents:
  count: 7
  brain: state-machine
  roles:
    - name: coordinator
      count: 1
    - name: reporter
      count: 6

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: pn_counter
  privacy: noop
  datafacts: datafacts_v1

task:
  type: memory_basis_fusion_calculator
  config:
    required_basis: [add, subtract, multiply, divide]
    threshold: 4
    saturation_fixture: amdgpu_object_saturation_payload.c

failures:
  message_drop: 0.0

duration: "ticks: 1000"

metrics:
  - message_count
  - agent_count

output:
  trace: ./traces/memory_code_saturation_calculator.jsonl
