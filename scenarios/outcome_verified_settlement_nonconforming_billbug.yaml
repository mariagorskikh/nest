# Outcome-verified settlement L3 CONFORMANCE bill-bug scenario (negative control) -- hackathon problem 03.
# Identical to outcome_verified_settlement_nonconforming except bill_regardless: true.
# That flag is the injected over-bill bug: the buyer bills even on a FAILING
# evaluator-gate verdict and keeps streaming to close_at_tick, draining
# close_at_tick * rate_per_tick > nonconform_at_tick * rate_per_tick. The
# validator validate_outcome_verified_settlement_no_overbill_on_failed_verification
# catches exactly this: it asserts drained <= rate * (pass verdicts) on every
# content-gated closed stream, so it FAILS here while the other three validators
# still PASS -- including validate_outcome_verified_settlement_verdicts_match_
# committed_criterion, since this bug is billing-despite-a-correctly-labeled-fail,
# not a mislabeled verdict. This file is the negative control that proves the
# no-overbill-on-failed-verification validator fires on an L3 over-bill, not
# just the L2 one the existing degrade_billbug scenario already covers.
name: outcome_verified_settlement_nonconforming_billbug
description: "Same as the nonconforming scenario but bill_regardless: true -> bills past the L3-verified prefix; only the no-overbill-on-failed-verification validator fails."

tier: 1
seed: 42

agents:
  count: 10
  brain: state-machine
  roles:
    - name: buyer
      count: 5
    - name: seller
      count: 5

layers:
  payments: outcome_verified_settlement

task:
  type: outcome_verified_settlement   # resolves the existing factory -- do NOT rename
  config:
    rate_per_tick: 1
    max_total: 20
    close_at_tick: 5
    tick_interval: 1.0
    ack_timeout: 2.0
    bill_on_send: false
    max_retries: 2
    initial_balance: 1000
    gate: evaluator
    criterion: reference_match
    nonconform_at_tick: 3
    nonconform_mode: replay_previous
    bill_regardless: true    # BUG: bill even on a failing verdict and keep streaming to close_at_tick

failures:
  message_drop: 0.05
  network_partition:
    groups:
      - ["buyer-0", "buyer-1", "buyer-2", "buyer-3", "buyer-4", "seller-0", "seller-1", "seller-2", "seller-3"]
      - ["seller-4"]

duration: "ticks: 10000"

metrics:
  - message_count
  - dropped_count

output:
  trace: ./traces/outcome_verified_settlement_nonconforming_billbug.jsonl
