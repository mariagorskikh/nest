# SPDX-License-Identifier: Apache-2.0
# OR-Set concurrent-writers scenario: 8 agents add/remove items and gossip to convergence under loss.
name: memory_or_set_writers
description: "8 agents add/remove items to a shared OR-Set under 10% message drop; CRDT merge converges."
tier: 1
seed: 42
agents:
  count: 8
  brain: state-machine

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: or_set
  privacy: noop
  datafacts: datafacts_v1
task:
  type: memory_or_set_writers
  config:
    rounds: 20
    key: shared
    values:
      - apple
      - banana
      - cherry
    add_fraction: 0.75  # 75% of actions are adds
    remove_fraction: 0.25 # 25% are removes
failures:
  message_drop: 0.1
duration: "ticks: 100000"
metrics:
  - message_count
  - agent_count
output:
  trace: ./traces/memory_or_set_writers.jsonl
