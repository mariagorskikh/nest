# SPDX-License-Identifier: Apache-2.0
# Weighted trust scenario: test recency-decayed, volume-weighted reputation.
# Compares the weighted trust model against the flat-average model with
# honest agents, occasional failures, and byzantine attackers.
name: weighted_trust
description: "16 honest, 4 malicious traders. Weighted trust model with recency decay and reporter credibility."

tier: 1
seed: 42

agents:
  count: 21
  brain: state-machine
  roles:
    - name: honest
      count: 16
    - name: malicious
      count: 4
    - name: observer
      count: 1

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: weighted
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: reputation
  config:
    rounds: 5
    malicious_fraction: 0.2

failures:
  message_drop: 0.0

duration: "ticks: 10000"

metrics:
  - success_rate
  - message_count
  - agent_count

output:
  trace: ./traces/weighted_trust.jsonl
