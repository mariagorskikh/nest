# SPDX-License-Identifier: Apache-2.0
# Fair-ordering scenario: a sequencer orders a batch of trader orders without
# being able to front-run them. The validators reconstruct the neutral arrival
# order from the engine's `corr` ids and assert `executed == arrival`.
#   coordination: fifo_fair  -> PASS (executes in arrival order)
#   coordination: predatory  -> FAIL (reorders by price = front-run)
#   coordination: contract_net -> FAIL (no fair-ordering API, no order:* events)
name: fair_ordering
description: "1 sequencer + 8 traders; engine-authored FIFO defeats a front-running sequencer."

tier: 1
seed: 42

agents:
  count: 9
  brain: state-machine
  roles:
    - name: sequencer
      count: 1
    - name: trader
      count: 8

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: fifo_fair
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: fair_ordering
  config: {}

failures:
  message_drop: 0.0

duration: "ticks: 10000"

metrics:
  - message_count
  - agent_count

output:
  trace: traces/fair_ordering.jsonl
