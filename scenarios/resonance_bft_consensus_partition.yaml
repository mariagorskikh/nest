# SPDX-License-Identifier: Apache-2.0
# End-to-end ResonanceBFT consensus UNDER a 4/3 network partition, driven through the
# town transport.  n=7, f=2, quorum_needed = n-f = 5.  The leader sits in the 4-agent
# group, so it can only collect 4 sealed evaluations (< 5) and NEVER commits while the
# partition holds — demonstrating the liveness/safety property end-to-end (not just in
# the unit suite): progress requires a sufficient quorum, a partitioned minority cannot
# fork the commit.
name: resonance_bft_consensus_partition
description: |
  ResonanceBFT driven end-to-end under a 4/3 partition.  Neither side reaches the
  n-f=5 quorum, so no commit is produced while partitioned — the liveness guarantee,
  observed through the real runner.

tier: 1
seed: 42

agents:
  count: 7
  brain: state-machine
  roles:
    - name: leader
      count: 1
    - name: follower
      count: 6

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: resonance_bft
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: resonance_bft_consensus
  config:
    expected_participants: 7
    rounds: 1
    embed: demo

failures:
  message_drop: 0.0
  network_partition:
    groups:
      - [leader-0, follower-0, follower-1, follower-2]
      - [follower-3, follower-4, follower-5]
  byzantine_agents: 0.0

duration: "ticks: 10000"

metrics:
  - success_rate
  - message_count
  - agent_count

output:
  trace: ./traces/resonance_bft_consensus_partition.jsonl
