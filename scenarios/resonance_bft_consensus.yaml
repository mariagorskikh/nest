# SPDX-License-Identifier: Apache-2.0
# End-to-end ResonanceBFT consensus driven THROUGH the town transport, at scale.
# Unlike the built-in `consensus` scenario (a toy leader/follower vote that ignores
# the coordination plugin), this scenario's agents call the real ResonanceBFT
# protocol (propose -> participate -> resolve -> commit) over the message bus across
# multiple rounds, with a dense embedding on the semantic axis so the antonym-anchored
# stance audit (false_agreement) actually fires end-to-end.
#
# 12 agents (n=12, f=3, quorum_needed = n-f = 9). 6 rounds. Odd rounds are unanimous
# (genuine consensus, false_agreement=0); even rounds split approve/reject on the SAME
# topic -- cosine still commits them (false consensus), and the stance audit flags it.

name: resonance_bft_consensus
description: |
  ResonanceBFT consensus driven end-to-end by the agents over the in-memory
  transport, 12 agents x 6 rounds, with a dense (embedding) semantic axis. Trust
  adapts across rounds (L3) and the stance audit flags false consensus where agents
  share a topic but oppose on stance.

tier: 1
seed: 42

agents:
  count: 12
  brain: state-machine
  roles:
    - name: leader
      count: 1
    - name: follower
      count: 11

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: resonance_bft
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: resonance_bft_consensus
  config:
    expected_participants: 12
    rounds: 6
    embed: demo

failures:
  message_drop: 0.0
  byzantine_agents: 0.0

duration: "ticks: 100000"

metrics:
  - success_rate
  - message_count
  - agent_count

output:
  trace: ./traces/resonance_bft_consensus.jsonl
