# Outcome-verified settlement ROLLING-streams scenario -- hackathon problem 03.
# Same 5x5/5%-drop/partition-on-seller-4 shape and the same L3 conformance
# setup as outcome_verified_settlement_nonconforming, plus streams_per_buyer: 3.
# Each buyer rolls THREE consecutive streams: cycle 1 keeps the legacy ref
# ({buyer}-stream), cycles 2-3 open fresh refs ({buyer}-stream-r2 / -r3) one
# tick after the previous close, with the same rate/cap/gate/criterion and
# cycle length. seq restarts at 0 per cycle, so the seller's nonconform
# injection recurs at the same RELATIVE offset (seq >= 3) in EVERY cycle: each
# cycle degrade-closes on the first failing verdict, and the next cycle still
# opens. Per-cycle caps and billing are independent (validators group per ref).
# All 4 validators PASS here (correct implementation: each cycle bills only its
# own verified prefix).
name: outcome_verified_settlement_rolling
description: "Rolling streams: each buyer rolls 3 consecutive L3-gated streams; a failed verdict closes only that cycle, the next still opens."

tier: 1
seed: 42

agents:
  count: 10
  brain: state-machine
  roles:
    - name: buyer
      count: 5
    - name: seller
      count: 5

layers:
  payments: outcome_verified_settlement

task:
  type: outcome_verified_settlement   # resolves the existing factory -- do NOT rename
  config:
    rate_per_tick: 1
    max_total: 20
    close_at_tick: 5
    tick_interval: 1.0
    ack_timeout: 2.0
    bill_on_send: false
    max_retries: 2
    initial_balance: 1000
    streams_per_buyer: 3     # rolling: 3 consecutive streams per buyer (default 1 = legacy)
    gate: evaluator          # L3 conformance gate (EvaluatorGate, composes ChecksumGate)
    criterion: reference_match
    nonconform_at_tick: 3    # recurs at seq >= 3 in EVERY cycle (seq restarts per cycle)
    nonconform_mode: replay_previous   # replay_previous | stale_first | empty
    bill_regardless: false   # correct: never bill past the verified prefix

failures:
  message_drop: 0.05
  network_partition:
    groups:
      - ["buyer-0", "buyer-1", "buyer-2", "buyer-3", "buyer-4", "seller-0", "seller-1", "seller-2", "seller-3"]
      - ["seller-4"]

duration: "ticks: 10000"

metrics:
  - message_count
  - dropped_count

output:
  trace: ./traces/outcome_verified_settlement_rolling.jsonl
