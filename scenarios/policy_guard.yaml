name: Policy Guard
description: Deterministic policy decisions for risky agent actions
tier: 1
seed: 42
agents:
  count: 1
  brain: state-machine
  roles:
    - name: policy-auditor
      count: 1
layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1
task:
  type: policy_guard
  config:
    policy_plugin: strict_rules
failures:
  message_drop: 0.0
  byzantine_agents: 0.0
duration: "ticks: 10"
output:
  trace: ./traces/policy_guard.jsonl
