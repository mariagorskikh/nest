# SPDX-License-Identifier: Apache-2.0
# Medical data exchange with selective disclosure.
#
# A hospital agent holds multi-field patient credentials (diagnosis, treatment,
# demographics).  Three insurer agents each request different field subsets.
# An auditor verifies the proofs.  The privacy layer is `hybrid_x25519` — the
# real hybrid-encryption + Merkle selective-disclosure plugin — so:
#
#   - encrypted messages are only readable by the intended audience,
#   - proofs reveal only the requested fields without leaking the rest, and
#   - the trace stays byte-deterministic under replay (Tier-1).
#
# This scenario exercises the `prove`/`verify_proof` code path that the
# existing `sealed_bid_with_privacy.yaml` does not cover (that scenario
# tests only `encrypt`/`decrypt`).
name: medical_data_exchange
description: "Hospital shares patient data with insurers using selective disclosure."

tier: 1
seed: 42

agents:
  count: 5
  brain: state-machine
  roles:
    - name: hospital
      count: 1
    - name: insurer
      count: 3
    - name: auditor
      count: 1

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: hybrid_x25519
  datafacts: datafacts_v1

task:
  type: medical_exchange
  config:
    rounds: 2

failures:
  message_drop: 0.0

duration: "ticks: 10000"

metrics:
  - success_rate
  - message_count
  - agent_count

output:
  trace: ./traces/medical_data_exchange.jsonl
