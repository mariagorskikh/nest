# SPDX-License-Identifier: Apache-2.0
# Delegated auth scenario: coordinator issues a root token and delegates
# narrowing sub-capabilities through 3 intermediary agents to 12 leaf agents.
# Validates scope enforcement, cascading revocation, and audience binding.

name: delegated_auth
description: |
  A coordinator holds a root token with full scopes [read, write, exec, admin].
  It delegates [read, write, exec] to 3 intermediaries; each intermediary
  delegates [read, exec] to 4 leaf agents.  Mid-scenario the coordinator
  revokes one intermediary's token; the downstream 4 leaves must fail
  verification.  Three adversarial validators check: no scope escalation
  occurred, no stale-parent token was accepted, and no audience confusion.

tier: 1
seed: 42

agents:
  count: 16
  brain: state-machine
  roles:
    - name: coordinator
      count: 1
      config:
        root_scopes: [read, write, exec, admin]
    - name: intermediary
      count: 3
      config:
        delegate_scopes: [read, write, exec]
    - name: leaf
      count: 12
      config:
        expected_scopes: [read, exec]

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: delegatable
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: delegated_auth
  config:
    rounds: 50
    revoke_intermediary: 1

failures:
  message_drop: 0.0
  byzantine_agents: 0.0

duration: "ticks: 5000"

metrics:
  - message_count
  - agent_count

output:
  trace: ./traces/delegated_auth.jsonl
