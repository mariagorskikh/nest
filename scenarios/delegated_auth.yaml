# SPDX-License-Identifier: Apache-2.0
# Delegated auth scenario: coordinator mints root tokens for intermediaries,
# who delegate scoped-down tokens to leaf agents. Tests cascading revocation
# and audience enforcement across the delegation tree.

name: delegated_auth
description: |
  1 coordinator, 3 intermediaries, and 12 leaf agents in a delegation tree.
  The coordinator issues root tokens to intermediaries, who delegate
  subset-scoped tokens to leaf agents. Mid-scenario, one intermediary is
  revoked, and the validator confirms its leaf agents lose access while
  other subtrees remain intact.

tier: 1
seed: 42

agents:
  count: 16
  brain: state-machine
  roles:
    - name: coordinator
      count: 1
      config:
        initial_balance: 10000
    - name: intermediary
      count: 3
      config:
        initial_balance: 1000
    - name: leaf
      count: 12
      config:
        initial_balance: 100

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: delegatable
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: delegated_auth
  config:
    rounds: 5
    delegation_depth: 2
    revoke_at_round: 3

failures:
  message_drop: 0.0
  byzantine_agents: 0.0

duration: "ticks: 10000"

metrics:
  - message_count
  - agent_count

output:
  trace: ./traces/delegated_auth.jsonl
