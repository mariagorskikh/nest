# SPDX-License-Identifier: Apache-2.0
# Delegated auth scenario: HMAC capability tokens flow through a trust hierarchy.
name: delegated_auth
description: |
  1 coordinator issues a root capability token and delegates scoped child
  tokens to 3 intermediaries.  Each intermediary re-delegates narrower
  tokens to 4 leaf agents.  Leaves verify with audience binding; the
  coordinator counts verified confirmations.

tier: 1
seed: 42

agents:
  count: 16
  brain: state-machine
  roles:
    - name: coordinator
      count: 1
    - name: intermediary
      count: 3
    - name: leaf
      count: 12

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: delegatable
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: delegated_auth
  config: {}

failures:
  message_drop: 0.0
  byzantine_agents: 0.0

duration: "ticks: 500"

metrics:
  - message_count
  - agent_count

output:
  trace: ./traces/delegated_auth.jsonl
