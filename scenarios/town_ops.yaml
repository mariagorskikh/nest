# SPDX-License-Identifier: Apache-2.0
# Town-ops scenario: agents triage and coordinate responses to town issues.
name: town_ops
description: "Town operations triage: agents classify, assign, and resolve citizen-reported issues across zones."

tier: 2
seed: 42

agents:
  count: 6
  brain: llm
  roles:
    - name: triage-agent
      count: 1
    - name: zone-dispatcher
      count: 2
    - name: resident-agent
      count: 1
    - name: resolver-agent
      count: 1
    - name: coordinator
      count: 1

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: town_ops
  config:
    zones:
      - Downtown
      - Residential North
      - Residential South
      - Commercial East
      - Industrial West
    issue_types:
      - Pothole
      - Streetlight Outage
      - Tree Hazard
      - Water Leak
      - Noise Complaint
      - Road Closure
      - Garbage Collection
      - Graffiti
    issues_per_round: 5
    rounds: 10
    sla_hours:
      critical: 2
      high: 12
      medium: 48
      low: 168

failures:
  message_drop: 0.05

duration: "ticks: 15000"

metrics:
  - success_rate
  - mean_latency
  - message_count
  - agent_count
  - sla_compliance_rate

output:
  trace: ./traces/town_ops.jsonl
