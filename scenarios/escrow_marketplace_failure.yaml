# SPDX-License-Identifier: Apache-2.0
# Failure-mode variant of escrow_marketplace with message drops enabled.
name: escrow_marketplace_failure
description: |
  Same as escrow_marketplace but with message_drop=0.05 to exercise
  dropped delivery / dispute paths under failure injection.
tier: 1
seed: 42
agents:
  count: 9
  brain: state-machine
  roles:
    - name: buyer
      count: 3
      config: {}
    - name: seller
      count: 3
      config: {}
    - name: arbiter
      count: 3
      config: {}
layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: escrow
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1
task:
  type: escrow_marketplace
  config: {}
failures:
  message_drop: 0.05
  byzantine_agents: 0.0
duration: "ticks: 200"
metrics:
  - message_count
  - agent_count
output:
  trace: ./traces/escrow_marketplace_failure.jsonl
