# SPDX-License-Identifier: Apache-2.0
# End-to-end ResonanceBFT under BYZANTINE (lying) faults, driven through the town transport.
# n=10, f=3, quorum_needed = n-f = 7. Two followers submit TAMPERED records (they mutate their
# sealed belief after participate() without recomputing the SHA-256 seal / ed25519 signature).
# resolve() must detect the seal mismatch, flag them tampered, exclude them from the centroid,
# and still commit with the honest quorum — the real Byzantine fault mode (not a crash).
name: resonance_bft_consensus_byzantine
description: |
  ResonanceBFT commits over the transport despite 2 of 10 agents submitting tampered
  (broken-seal) records: they are detected and excluded, the honest quorum commits.
tier: 1
seed: 42
agents:
  count: 10
  brain: state-machine
  roles:
    - name: leader
      count: 1
    - name: follower
      count: 9
layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: resonance_bft
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1
task:
  type: resonance_bft_consensus
  config:
    expected_participants: 10
    rounds: 1
    embed: demo
    byzantine: 2
failures:
  message_drop: 0.0
  byzantine_agents: 0.0
duration: "ticks: 100000"
metrics: [success_rate, message_count, agent_count]
output:
  trace: ./traces/resonance_bft_consensus_byzantine.jsonl
