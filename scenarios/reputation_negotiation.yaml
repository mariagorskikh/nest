# SPDX-License-Identifier: Apache-2.0
# Reputation-gated negotiation: buyers check seller trust scores before trading.
name: reputation_negotiation
description: |
  10 buyers and 10 sellers negotiate over price. Buyers query the trust
  layer before committing and reject sellers with low reputation.
  Validates that trust score influences negotiation outcomes.

tier: 1
seed: 42

agents:
  count: 20
  brain: state-machine
  roles:
    - name: buyer
      count: 10
      config:
        min_trust_threshold: 3
    - name: seller
      count: 10

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: marketplace
  config:
    catalog_size: 50
    rounds: 5

failures:
  message_drop: 0.02
  byzantine_agents: 0.1

duration: "ticks: 5000"

metrics:
  - success_rate
  - message_count
  - agent_count

output:
  trace: ./traces/reputation_negotiation.jsonl
